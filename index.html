<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedEstudos PRO - Faculdade Online de Medicina</title>
    <style>
        :root {
            --primary-color: #007791;
            --secondary-color: #00a8cc;
            --dark-color: #1a252f;
            --sidebar-color: #2c3e50;
            --light-color: #f4f7f6;
            --white: #ffffff;
            --border-radius: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            background-color: var(--light-color);
            color: var(--dark-color);
            min-height: 100vh;
        }

        /* Menu Lateral */
        .sidebar {
            width: 280px;
            background-color: var(--sidebar-color);
            color: var(--white);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            z-index: 10;
        }

        .logo-area {
            padding: 20px;
            background-color: #111a24;
            text-align: center;
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--secondary-color);
            border-bottom: 1px solid #34495e;
        }

        .menu-title {
            padding: 15px 20px 5px 20px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #bdc3c7;
            font-weight: bold;
        }

        .period-list {
            list-style: none;
            padding: 0 10px;
        }

        .period-item {
            display: block;
            width: 100%;
            padding: 10px 15px;
            margin: 3px 0;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.95rem;
            color: #ecf0f1;
            border: none;
            background: none;
            text-align: left;
        }

        .period-item:hover, .period-item.active {
            background-color: var(--primary-color) !important;
            color: var(--white) !important;
            font-weight: 600;
        }

        /* Conteúdo Principal */
        .main-content {
            margin-left: 280px;
            flex: 1;
            padding: 40px;
        }

        header {
            margin-bottom: 30px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 15px;
        }

        header h1 {
            color: var(--primary-color);
            font-size: 2.2rem;
        }

        header p {
            color: #7f8c8d;
            margin-top: 5px;
        }

        /* Grid de Disciplinas Dinâmicas */
        .subjects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: var(--white);
            border-radius: var(--border-radius);
            padding: 22px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-top: 4px solid var(--primary-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 220px;
        }

        .card-body h3 {
            margin-bottom: 10px;
            color: #2c3e50;
            font-size: 1.2rem;
        }

        .card-body p {
            font-size: 0.9rem;
            color: #555;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .btn-study {
            display: block;
            width: 100%;
            background-color: var(--primary-color);
            color: var(--white);
            padding: 10px 15px;
            border-radius: 5px;
            text-align: center;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: background 0.2s;
        }

        .btn-study:hover {
            background-color: var(--secondary-color);
        }

        /* Janela Modal Expandida */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-box {
            background-color: var(--white);
            padding: 30px;
            border-radius: var(--border-radius);
            width: 100%;
            max-width: 800px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .close-modal {
            position: absolute;
            top: 15px; right: 20px;
            font-size: 1.8rem;
            cursor: pointer;
            color: #aaa;
        }

        .close-modal:hover { color: var(--dark-color); }

        .modal-box h2 { color: var(--primary-color); margin-bottom: 15px; border-bottom: 2px solid #eee; padding-bottom: 10px; }

        .study-image-container {
            width: 100%;
            margin: 15px 0;
            text-align: center;
            background: #fdfdfd;
            border: 1px dashed #ccc;
            border-radius: 6px;
            padding: 10px;
        }

        .study-image {
            max-width: 100%;
            height: auto;
            max-height: 300px;
            border-radius: 4px;
            object-fit: contain;
        }

        .topic-list { 
            margin-top: 20px; 
            list-style-type: none;
        }
        
        .topic-list li { 
            padding: 12px 15px; 
            border-bottom: 1px solid #eee; 
            font-size: 0.95rem; 
            background: #fafbfc;
            margin-bottom: 5px;
            border-left: 4px solid var(--secondary-color);
            border-radius: 0 4px 4px 0;
        }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; position: relative; }
            .main-content { margin-left: 0; padding: 20px; }
        }
    </style>
</head>
